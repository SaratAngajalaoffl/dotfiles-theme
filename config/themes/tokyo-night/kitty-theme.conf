# The basic colors
foreground              #c0caf5
background              #1a1b26
selection_foreground    #1a1b26
selection_background    #ff7a93

# Cursor colors
cursor                  #ff7a93
cursor_text_color       #1a1b26

# Scrollbar colors
scrollbar_handle_color  #a9b1d6
scrollbar_track_color   #363b56

# URL color when hovering with mouse
url_color               #ff7a93

# Kitty window border colors
active_border_color     #7da6ff
inactive_border_color   #414766
bell_border_color       #e0af68

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #0e0e14
active_tab_background   #ad8ee6
inactive_tab_foreground #c0caf5
inactive_tab_background #13141c
tab_bar_background      #0e0e14

# Colors for marks (marked text in the terminal)
mark1_foreground #1a1b26
mark1_background #7da6ff
mark2_foreground #1a1b26
