## blurb:    Soothing pastel theme for the high-spirited!



# The basic colors
foreground              #c0caf5
background              #1a1b26
selection_foreground    #1a1b26
selection_background    #c0caf5

# Cursor colors
cursor                  #c0caf5
cursor_text_color       #1a1b26

# Scrollbar colors
scrollbar_handle_color  #737aa2
scrollbar_track_color   #292e42

# URL color when hovering with mouse
url_color               #c0caf5

# Kitty window border colors
active_border_color     #9aa5ce
inactive_border_color   #414868
bell_border_color       #e0af68

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #13131a
active_tab_background   #9d7cd8
inactive_tab_foreground #c0caf5
inactive_tab_background #16161e
tab_bar_background      #13131a

# Colors for marks (marked text in the terminal)
mark1_foreground #1a1b26
mark1_background #9aa5ce
mark2_foreground #1a1b26
mark2_background #9d7cd8
mark3_foreground #1a1b26
mark3_background #0db9d7

# The 16 terminal colors

# black
color0 #292e42
color8 #3b4261

# red
color1 #f7768e
color9 #f7768e

# green
color2  #9ece6a
color10 #9ece6a

# yellow
color3  #e0af68
color11 #e0af68

# blue
color4  #7aa2f7
color12 #7aa2f7

# magenta
color5  #bb9af7
color13 #bb9af7

# cyan
color6  #73daca
color14 #73daca

# white
