# The basic colors
foreground              #ffffff
background              #000000
selection_foreground    #000000
selection_background    #a4a4a4

# Cursor colors
cursor                  #a4a4a4
cursor_text_color       #000000

# Scrollbar colors
scrollbar_handle_color  #ffffff
scrollbar_track_color   #2d2d2d

# URL color when hovering with mouse
url_color               #a4a4a4

# Kitty window border colors
active_border_color     #8d8d8d
inactive_border_color   #343434
bell_border_color       #cecece

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #070707
active_tab_background   #9b9b9b
inactive_tab_foreground #ffffff
inactive_tab_background #090909
tab_bar_background      #070707

# Colors for marks (marked text in the terminal)
mark1_foreground #000000
mark1_background #8d8d8d
mark2_foreground #000000
mark2_background #9b9b9b
mark3_foreground #000000
mark3_background #a2a2a2

# The 16 terminal colors

# black
color0 #2d2d2d
color8 #1a1a1a

# red
color1 #a4a4a4
color9 #a4a4a4

# green
color2  #b6b6b6
color10 #b6b6b6

# yellow
color3  #cecece
color11 #cecece

# blue
color4  #8d8d8d
color12 #8d8d8d

# magenta
color5  #9b9b9b
color13 #9b9b9b

# cyan
color6  #b0b0b0
color14 #b0b0b0

# white
color7  #ececec
color15 #ffffff
