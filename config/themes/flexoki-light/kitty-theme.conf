# The basic colors
foreground              #fffcf0
background              #100f0f
selection_foreground    #100f0f
selection_background    #d55b50

# Cursor colors
cursor                  #d55b50
cursor_text_color       #100f0f

# Scrollbar colors
scrollbar_handle_color  #98968f
scrollbar_track_color   #393735

# URL color when hovering with mouse
url_color               #d55b50

# Kitty window border colors
active_border_color     #4385be
inactive_border_color   #666460
bell_border_color       #d0a215

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #0b0a0a
active_tab_background   #ce5d97
inactive_tab_foreground #fffcf0
inactive_tab_background #0d0c0c
tab_bar_background      #0b0a0a

# Colors for marks (marked text in the terminal)
mark1_foreground #100f0f
mark1_background #4385be
mark2_foreground #100f0f
mark2_background #ce5d97
mark3_foreground #100f0f
mark3_background #308ba2

