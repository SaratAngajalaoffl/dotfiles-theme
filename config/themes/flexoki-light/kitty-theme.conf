# The basic colors
foreground              #100f0f
background              #fffcf0
selection_foreground    #fffcf0
selection_background    #d14d41

# Cursor colors
cursor                  #d14d41
cursor_text_color       #fffcf0

# Scrollbar colors
scrollbar_handle_color  #100f0f
scrollbar_track_color   #c5c3ba

# URL color when hovering with mouse
url_color               #d14d41

# Kitty window border colors
active_border_color     #4385be
inactive_border_color   #b1afa7
bell_border_color       #d0a215

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #e5e2d8
active_tab_background   #ce5d97
inactive_tab_foreground #100f0f
inactive_tab_background #f2efe4
tab_bar_background      #e5e2d8

# Colors for marks (marked text in the terminal)
mark1_foreground #fffcf0
mark1_background #4385be
mark2_foreground #fffcf0
mark2_background #ce5d97
mark3_foreground #fffcf0
mark3_background #308ba2

