# The basic colors
foreground              #d3c6aa
background              #2d353b
selection_foreground    #2d353b
selection_background    #e67e80

# Cursor colors
cursor                  #e67e80
cursor_text_color       #2d353b

# Scrollbar colors
scrollbar_handle_color  #d3c6aa
scrollbar_track_color   #3d484d

# URL color when hovering with mouse
url_color               #e67e80

# Kitty window border colors
active_border_color     #7fbbb3
inactive_border_color   #434c52
bell_border_color       #dbbc7f

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #181d20
active_tab_background   #d699b6
inactive_tab_foreground #d3c6aa
inactive_tab_background #21272c
