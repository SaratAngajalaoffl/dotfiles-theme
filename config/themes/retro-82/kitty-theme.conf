# The basic colors
foreground              #f6dcac
background              #05182e
selection_foreground    #05182e
selection_background    #f85525

# Cursor colors
cursor                  #f85525
cursor_text_color       #05182e

# Scrollbar colors
scrollbar_handle_color  #f6dcac
scrollbar_track_color   #1d4a5a

# URL color when hovering with mouse
url_color               #f85525

# Kitty window border colors
active_border_color     #faa968
inactive_border_color   #2b656a
bell_border_color       #e97b3c

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #020c17
active_tab_background   #3f8f8a
inactive_tab_foreground #f6dcac
inactive_tab_background #031222
