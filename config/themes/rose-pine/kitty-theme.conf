# The basic colors
foreground              #faf4ed
background              #1c1a28
selection_foreground    #1c1a28
selection_background    #ba6f85

# Cursor colors
cursor                  #ba6f85
cursor_text_color       #1c1a28

# Scrollbar colors
scrollbar_handle_color  #9b9698
scrollbar_track_color   #423f49

# URL color when hovering with mouse
