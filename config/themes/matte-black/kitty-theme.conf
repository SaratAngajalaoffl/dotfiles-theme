color0 #313131
color8 #1e1e1e

# red
color1 #d35f5f
color9 #d35f5f

# green
color2  #ffc107
color10 #ffc107

# yellow
color3  #b91c1c
color11 #b91c1c

# blue
color4  #e68e0d
color12 #e68e0d

# magenta
color5  #b91c1c
color13 #b91c1c

