# The basic colors
foreground              #eff1f5
background              #1a1b24
selection_foreground    #1a1b24
selection_background    #dc8a78

# Cursor colors
cursor                  #dc8a78
cursor_text_color       #1a1b24

# Scrollbar colors
scrollbar_handle_color  #93959b
scrollbar_track_color   #3e3f48

# URL color when hovering with mouse
