## blurb:    Soothing pastel theme for the high-spirited!



# The basic colors
foreground              #ffffff
background              #1a1a1a
selection_foreground    #1a1a1a
selection_background    #d5d5d5

# Cursor colors
cursor                  #d5d5d5
cursor_text_color       #1a1a1a

# Scrollbar colors
scrollbar_handle_color  #9d9d9d
scrollbar_track_color   #414141

# URL color when hovering with mouse
url_color               #d5d5d5

# Kitty window border colors
active_border_color     #e5e5e5
inactive_border_color   #6c6c6c
bell_border_color       #b5b5b5

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #121212
active_tab_background   #d1d1d1
inactive_tab_foreground #ffffff
inactive_tab_background #151515
tab_bar_background      #121212

# Colors for marks (marked text in the terminal)
mark1_foreground #1a1a1a
mark1_background #e5e5e5
mark2_foreground #1a1a1a
mark2_background #d1d1d1
mark3_foreground #1a1a1a
mark3_background #cfcfcf

# The 16 terminal colors

# black
color0 #414141
color8 #535353

# red
color1 #d5d5d5
color9 #d5d5d5

# green
color2  #c5c5c5
color10 #c5c5c5

# yellow
color3  #b5b5b5
color11 #b5b5b5

# blue
color4  #e5e5e5
color12 #e5e5e5

# magenta
color5  #d1d1d1
color13 #d1d1d1

# cyan
color6  #c1c1c1
color14 #c1c1c1

# white
color7  #d1d1d1
color15 #b6b6b6
