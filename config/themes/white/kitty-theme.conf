# The basic colors
foreground              #000000
background              #ffffff
selection_foreground    #ffffff
selection_background    #2a2a2a

# Cursor colors
cursor                  #2a2a2a
cursor_text_color       #ffffff

# Scrollbar colors
scrollbar_handle_color  #000000
scrollbar_track_color   #c0c0c0

# URL color when hovering with mouse
url_color               #2a2a2a

# Kitty window border colors
active_border_color     #1a1a1a
inactive_border_color   #d6d6d6
bell_border_color       #4a4a4a

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #e8e8e8
active_tab_background   #2e2e2e
inactive_tab_foreground #000000
inactive_tab_background #f5f5f5
tab_bar_background      #e8e8e8

# Colors for marks (marked text in the terminal)
mark1_foreground #ffffff
mark1_background #1a1a1a
mark2_foreground #ffffff
mark2_background #2e2e2e
mark3_foreground #ffffff
mark3_background #303030

# The 16 terminal colors

# black
color0 #c0c0c0
color8 #c0c0c0

# red
color1 #2a2a2a
color9 #2a2a2a

# green
color2  #3a3a3a
color10 #3a3a3a

# yellow
color3  #4a4a4a
color11 #4a4a4a

# blue
color4  #1a1a1a
color12 #1a1a1a

# magenta
color5  #2e2e2e
color13 #2e2e2e

# cyan
color6  #3e3e3e
color14 #3e3e3e

# white
color7  #000000
