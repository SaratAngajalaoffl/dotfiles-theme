# The basic colors
foreground              #fafafa
background              #1c1c1c
selection_foreground    #1c1c1c
selection_background    #f930fb

# Cursor colors
cursor                  #f930fb
cursor_text_color       #1c1c1c

# Scrollbar colors
scrollbar_handle_color  #9b9b9b
scrollbar_track_color   #424242

# URL color when hovering with mouse
url_color               #f930fb

# Kitty window border colors
active_border_color     #5482ff
inactive_border_color   #6c6c6c
bell_border_color       #2986e3

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #131313
active_tab_background   #a471e0
inactive_tab_foreground #fafafa
inactive_tab_background #171717
tab_bar_background      #131313

# Colors for marks (marked text in the terminal)
mark1_foreground #1c1c1c
mark1_background #5482ff
mark2_foreground #1c1c1c
mark2_background #a471e0
mark3_foreground #1c1c1c
mark3_background #4d87e9

# The 16 terminal colors

# black
color0 #424242
color8 #545454

# red
color1 #d848d5
color9 #d848d5

# green
color2  #8676e0
color10 #8676e0

# yellow
color3  #2986e3
color11 #2986e3

# blue
color4  #5f86ef
color12 #5f86ef

# magenta
color5  #b363ff
color13 #b363ff

# cyan
color6  #4188e5
color14 #4188e5

